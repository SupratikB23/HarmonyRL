seed: 123
train:
  ckpt_dir: "checkpoints"
  init_from: "transformer_supervised.pt"
rl:
  iterations: 2000
  batch_size: 8
  rollout_len: 512
  temperature: 1.0
  top_p: 0.95
  lr: 1e-5
  ppo_epochs: 4
  clip_range: 0.2
  gamma: 1.0
  gae_lambda: 0.95
  kl_coef: 0.05
  value_coef: 0.5
  entropy_coef: 0.01
  clip_grad_norm: 1.0
  log_interval: 10
  save_interval: 100
reward:
  weights:
    harmony: 0.3
    scale: 0.2
    rhythm: 0.2
    diversity: 0.2
    density: 0.1
