[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonyrl"
version = "0.2.0"
description = "Symbolic music generation with supervised pretraining and PPO fine-tuning"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2", "numpy", "pretty_midi", "soundfile", "pyyaml", "tqdm",
]

[project.optional-dependencies]
audio = ["transformers>=4.41", "diffusers>=0.30", "accelerate>=0.33"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["harmonyrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
